<!DOCTYPE html>
<!-- The theme is one attribute, and tokens.css keys off it. It is
     written here rather than only from React so the very first paint
     already has the right colours - set it in JS alone and an earth-
     theme user sees a green page until the bundle loads. -->
<html lang="en" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return a
         real number instead of 0. Without it Android/iOS letterbox the web
         view away from the notch, the insets read as zero, and the CSS
         below silently does nothing.

         user-scalable=no + maximum-scale=1 stop the double-tap zoom that
         makes a wrapped web app feel like a web page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Check government mandi rates and real farmer-reported prices before you sell your crop."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Mandi Price Checker</title>
    <!-- Sets the accent BEFORE the page paints.
         This has to be an inline, blocking script in <head>. React does
         not mount until its bundle has downloaded and run, and until
         then the page shows whatever <html> already says - so someone on
         the earth theme would see a green page on every single load.
         Reading one word from localStorage here costs nothing.

         It repeats the default from context/ThemeContext.jsx on purpose:
         this must not import anything, or it stops being instant. The
         two only ever need to agree on the storage key and the
         fallback. -->
    <script>
      (function () {
        try {
          var accent = localStorage.getItem("mandi_theme_accent");
          if (["green", "earth"].indexOf(accent) === -1) accent = "green";
          document.documentElement.setAttribute("data-accent", accent);
        } catch (e) {
          // Blocked storage. The attribute already on <html> is a valid
          // theme, so there is nothing to fix.
        }
      })();
    </script>
  </head>
  <body>
    <!-- React takes over this single <div> and renders the whole app inside it. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
