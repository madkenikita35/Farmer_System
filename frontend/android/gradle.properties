# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# ---------------------------------------------------------------------
# WHICH JAVA GRADLE RUNS ON
# ---------------------------------------------------------------------
# Without this, Gradle uses whatever `java` is first on PATH - here that
# is JDK 19 - or, inside Android Studio, the IDE's own bundled JDK 21.
# Neither matches the Java 17 that app/build.gradle and Capacitor's
# generated capacitor.build.gradle compile against, and Gradle refuses
# to build when modules disagree about their target.
#
# Forward slashes on purpose: a backslash starts an escape sequence in a
# .properties file, so C:\Program Files would be read as C:Program Files.
#
# This path is specific to this machine. It is fine here because
# android/ is generated by `npx cap add` and not committed - but if that
# ever changes, this line has to move to a gradle.properties outside the
# repository.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot
